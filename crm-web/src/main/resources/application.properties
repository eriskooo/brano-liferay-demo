spring.application.name=crm-web

# Kontext /crm: nginx smeruje /crm/ sem, /web/ do Liferay – obe appky za jednou adresou (strangler).
server.servlet.context-path=/crm
# Vlastná session cookie s cestou /crm – za jednou adresou by JSESSIONID prepísal session Liferay (pasca č. 12).
server.servlet.session.cookie.name=CRM_SESSION
server.servlet.session.cookie.path=/crm
server.servlet.session.tracking-modes=cookie
server.error.whitelabel.enabled=false

# JSP views – rovnaké umiestnenie ako v legacy portlet WARe (/WEB-INF/jsp/...)
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Identita zo SSO portálu (mock) a zdieľaná session v Redise – v Dockeri prepísané premennými prostredia.
crm.sso.api-url=http://localhost:8090/sso
crm.sso.login-url=/sso/login
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Krátke timeouty: pri výpadku Redisu má stránka zlyhať rýchlo a bežať ďalej bez zdieľanej session.
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# Backend blacklistu: memory = in-memory náhrada (default, testy bez DB) | jpa = zdieľaná DB so starou appkou (profil jpa).
crm.blacklist.store=memory
spring.datasource.url=jdbc:postgresql://localhost:5432/crm
spring.datasource.username=crm_app
spring.datasource.password=crm_app
# Pri výpadku DB nech stránka zlyhá rýchlo (Hikari sa pripája až pri prvom dotaze, nie pri štarte).
spring.datasource.hikari.connection-timeout=2000
# Schému vlastní backend (init skript) – Hibernate ju nikdy negeneruje; profil jpa ju len validuje.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Bez profilu jpa (testy bez DB) sa Hibernate pri štarte nesmie pripájať kvôli metadátam.
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# Entity sa mapujú na doménu v transakcii služby – JSP nedostane lazy kolekcie, open-in-view netreba.
spring.jpa.open-in-view=false
