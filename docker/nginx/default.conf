# Jedna adresa pre všetko: cookies SSO_ID a JSESSIONID tak vidia všetky aplikácie (cookies nerozlišujú port).
server {
    listen 80;
    # Relatívne presmerovania – inak by nginx do Location dal svoj interný port 80 namiesto :8000.
    absolute_redirect off;

    # Mock SSO portálu (externý systém).
    location /sso/ {
        proxy_pass http://sso-mock:8090;
        proxy_set_header Host $http_host;
    }

    # Strangler: zmigrovaný portlet blacklist obsluhuje nová appka. Aj staré URL portletu (render aj action URL
    # s p_p_id…) skončia na vyhľadávaní v novej appke – POST sa po 302 zmení na GET, nič sa neodošle dvakrát.
    location /web/crm/blacklist {
        return 302 /crm/blacklist/search;
    }

    # Nová appka (Spring Boot), kontext /crm.
    location /crm/ {
        proxy_pass http://crm-web:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Bonus: Rust kópia novej appky (podprojekt 3), len na vlastnej ceste /crm-rs. Predvolený blacklist (strangler vyššie,
    # odkaz „Blacklist“ v Liferay aj „/“) ostáva Java appka crm-web.
    # Kontajner je voliteľný (compose profil "rs"): adresa cez premennú sa resolvuje až pri requeste cez DNS Dockeru,
    # takže nginx naštartuje aj bez neho a /crm-rs vtedy vráti 502.
    location /crm-rs/ {
        resolver 127.0.0.11 valid=10s;
        set $crm_rs http://crm-web-rs:8080;
        proxy_pass $crm_rs;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = / {
        return 302 /web/crm/blacklist;
    }

    # Stará appka (Liferay). Host hlavička ostáva localhost:8000, aby portál skladal URL na túto adresu.
    location / {
        proxy_pass http://liferay:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
