<svg xmlns="http://www.w3.org/2000/svg" width="940" height="730" viewBox="0 0 940 730" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Souběh staré a nové aplikace: nginx, Spring Boot, Liferay, sdílená session v Redisu a sdílená DB v Postgresu</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5563"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8323b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="730" fill="#ffffff"/>

  <!-- Prohlížeč -->
  <rect x="370" y="20" width="200" height="46" rx="8" fill="#f4f6f8" stroke="#4a5563"/>
  <text x="470" y="40" text-anchor="middle" font-weight="bold" fill="#1d2433">Prohlížeč operátora</text>
  <text x="470" y="57" text-anchor="middle" fill="#5b6475" font-size="12">cookie SSO_ID</text>

  <line x1="470" y1="66" x2="470" y2="102" stroke="#4a5563" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- nginx -->
  <rect x="300" y="104" width="340" height="62" rx="8" fill="#e8eefc" stroke="#1f5fbf" stroke-width="1.6"/>
  <text x="470" y="128" text-anchor="middle" font-weight="bold" fill="#1d2433">nginx  http://localhost:8000</text>
  <text x="470" y="148" text-anchor="middle" fill="#1d2433" font-size="12">strangler: zmigrované stránky → Spring Boot, ostatní → Liferay</text>

  <!-- Směrování z nginx -->
  <path d="M330,166 C305,215 205,212 175,236" fill="none" stroke="#4a5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="22" y="196" fill="#1d2433" font-size="12">/crm/…</text>
  <text x="22" y="212" fill="#5b6475" font-size="11">(i /web/crm/blacklist → 302 sem)</text>

  <line x1="470" y1="166" x2="470" y2="236" stroke="#4a5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="478" y="206" fill="#1d2433" font-size="12">/web/…</text>

  <path d="M600,166 C640,200 760,205 790,236" fill="none" stroke="#4a5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="740" y="200" fill="#1d2433" font-size="12">/sso/…</text>

  <!-- Spring Boot (hotovo) -->
  <rect x="30" y="238" width="290" height="132" rx="8" fill="#e6f4ea" stroke="#1e7d32" stroke-width="1.8"/>
  <text x="175" y="262" text-anchor="middle" font-weight="bold" fill="#1d2433">Nová aplikace – crm-web</text>
  <text x="175" y="280" text-anchor="middle" fill="#5b6475" font-size="12">Spring Boot 4.1.1 · Java 21 · JSP</text>
  <rect x="50" y="292" width="250" height="30" rx="5" fill="#ffffff" stroke="#1e7d32"/>
  <text x="175" y="312" text-anchor="middle" fill="#1e7d32" font-weight="bold">✔ Blacklist (zmigrováno)</text>
  <text x="175" y="342" text-anchor="middle" fill="#1d2433" font-size="12">hlavička: operátor, zákazník,</text>
  <text x="175" y="358" text-anchor="middle" fill="#1d2433" font-size="12">poslední záznam, hlášky</text>

  <!-- Liferay (ještě nezmigrováno) -->
  <rect x="330" y="238" width="290" height="132" rx="8" fill="#fdf1e3" stroke="#c46a0f" stroke-width="1.8"/>
  <text x="475" y="262" text-anchor="middle" font-weight="bold" fill="#1d2433">Stará aplikace – Liferay 6.2</text>
  <text x="475" y="280" text-anchor="middle" fill="#5b6475" font-size="12">Java 8 · Spring Portlet MVC · JSP</text>
  <rect x="350" y="292" width="250" height="30" rx="5" fill="#ffffff" stroke="#c46a0f"/>
  <text x="475" y="312" text-anchor="middle" fill="#c46a0f" font-weight="bold">⏳ Dashboard (zatím v Liferay)</text>
  <text x="475" y="342" text-anchor="middle" fill="#1d2433" font-size="12">portlet hlavičky v theme;</text>
  <text x="475" y="358" text-anchor="middle" fill="#1d2433" font-size="12">PortletSession + Redis (flag)</text>

  <!-- SSO mock -->
  <rect x="680" y="238" width="230" height="132" rx="8" fill="#f4f6f8" stroke="#4a5563" stroke-width="1.6"/>
  <text x="795" y="262" text-anchor="middle" font-weight="bold" fill="#1d2433">SSO portál (mock)</text>
  <text x="795" y="280" text-anchor="middle" fill="#5b6475" font-size="12">Spring Boot · REST</text>
  <text x="795" y="306" text-anchor="middle" fill="#1d2433" font-size="12">identita operátora</text>
  <text x="795" y="322" text-anchor="middle" fill="#1d2433" font-size="12">a vybraný zákazník</text>
  <text x="795" y="348" text-anchor="middle" fill="#5b6475" font-size="11">GET /sso/api/sessions/{SSO_ID}</text>

  <!-- Identita ze SSO (přerušovaně) -->
  <line x1="620" y1="330" x2="678" y2="330" stroke="#4a5563" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <path d="M300,370 L300,390 L760,390 L760,373" fill="none" stroke="#4a5563" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="640" y="408" fill="#5b6475" font-size="11">identita (REST podle SSO_ID)</text>

  <!-- Sdílená session -->
  <line x1="230" y1="372" x2="250" y2="452" stroke="#b8323b" stroke-width="2" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <text x="262" y="422" fill="#b8323b" font-size="12">zápis + čtení</text>
  <text x="262" y="438" fill="#b8323b" font-size="12">(vždy Redis)</text>

  <line x1="380" y1="372" x2="370" y2="452" stroke="#b8323b" stroke-width="2" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <text x="390" y="422" fill="#b8323b" font-size="12">zápis do obou, čtení</text>
  <text x="390" y="438" fill="#b8323b" font-size="12">podle flagu PORTLET / REDIS</text>

  <rect x="120" y="454" width="420" height="112" rx="8" fill="#fdecea" stroke="#b8323b" stroke-width="1.8"/>
  <text x="330" y="478" text-anchor="middle" font-weight="bold" fill="#1d2433">Redis – sdílená session</text>
  <text x="330" y="500" text-anchor="middle" fill="#1d2433" font-family="Consolas, monospace" font-size="12">crm:session:{SSO_ID}   (hash, TTL 30 min, JSON)</text>
  <text x="330" y="518" text-anchor="middle" fill="#1d2433" font-family="Consolas, monospace" font-size="12">APP_MESSAGES · APP_LAST_VIEWED_RECORD</text>
  <text x="330" y="536" text-anchor="middle" fill="#1d2433" font-family="Consolas, monospace" font-size="12">APP_BLACKLIST_LAST_CRITERIA</text>
  <text x="330" y="556" text-anchor="middle" fill="#5b6475" font-family="Consolas, monospace" font-size="12">crm:flags:session-read-source = PORTLET | REDIS</text>

  <!-- Sdílená databáze -->
  <line x1="60" y1="372" x2="60" y2="616" stroke="#1f5fbf" stroke-width="2" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="70" y="600" fill="#1f5fbf" font-size="12">JPA / Hibernate</text>

  <line x1="605" y1="372" x2="605" y2="616" stroke="#1f5fbf" stroke-width="2" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="597" y="600" text-anchor="end" fill="#1f5fbf" font-size="12">Spring JDBC – DAO na tabulku (jako originál)</text>

  <rect x="30" y="618" width="590" height="96" rx="8" fill="#e8eefc" stroke="#1f5fbf" stroke-width="1.8"/>
  <text x="325" y="642" text-anchor="middle" font-weight="bold" fill="#1d2433">Postgres 16 – sdílená DB blacklistu</text>
  <text x="325" y="664" text-anchor="middle" fill="#1d2433" font-family="Consolas, monospace" font-size="12">schéma blacklist · uživatel crm_app (jen DML)</text>
  <text x="325" y="682" text-anchor="middle" fill="#1d2433" font-family="Consolas, monospace" font-size="12">blacklist_record · blacklist_identifier · blacklist_note</text>
  <text x="325" y="702" text-anchor="middle" fill="#5b6475" font-size="11">DDL + seed: docker/postgres/init/ · z hostu :5433</text>

  <!-- Legenda -->
  <rect x="660" y="454" width="250" height="140" rx="6" fill="#ffffff" stroke="#dde2ea"/>
  <text x="674" y="474" font-weight="bold" fill="#1d2433" font-size="12">Legenda</text>
  <rect x="674" y="484" width="14" height="12" fill="#e6f4ea" stroke="#1e7d32"/>
  <text x="696" y="494" fill="#1d2433" font-size="12">zmigrováno do Spring Boot</text>
  <rect x="674" y="504" width="14" height="12" fill="#fdf1e3" stroke="#c46a0f"/>
  <text x="696" y="514" fill="#1d2433" font-size="12">zatím v Liferay</text>
  <line x1="674" y1="532" x2="688" y2="532" stroke="#b8323b" stroke-width="2"/>
  <text x="696" y="536" fill="#1d2433" font-size="12">sdílená session (Redis)</text>
  <line x1="674" y1="552" x2="688" y2="552" stroke="#1f5fbf" stroke-width="2"/>
  <text x="696" y="556" fill="#1d2433" font-size="12">sdílená DB (Postgres)</text>
  <line x1="674" y1="572" x2="688" y2="572" stroke="#4a5563" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="696" y="576" fill="#1d2433" font-size="12">identita ze SSO portálu</text>
</svg>
