<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Súbeh starej a novej appky: nginx, Spring Boot, Liferay a zdieľaná session v Redise</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5563"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8323b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="600" fill="#ffffff"/>

  <!-- Prehliadač -->
  <rect x="370" y="20" width="200" height="46" rx="8" fill="#f4f6f8" stroke="#4a5563"/>
  <text x="470" y="40" text-anchor="middle" font-weight="bold" fill="#1d2433">Prehliadač operátora</text>
  <text x="470" y="57" text-anchor="middle" fill="#5b6475" font-size="12">cookie SSO_ID</text>

  <line x1="470" y1="66" x2="470" y2="102" stroke="#4a5563" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- nginx -->
  <rect x="300" y="104" width="340" height="62" rx="8" fill="#e8eefc" stroke="#1f5fbf" stroke-width="1.6"/>
  <text x="470" y="128" text-anchor="middle" font-weight="bold" fill="#1d2433">nginx  http://localhost:8000</text>
  <text x="470" y="148" text-anchor="middle" fill="#1d2433" font-size="12">strangler: zmigrované stránky → Spring Boot, ostatné → Liferay</text>

  <!-- Smerovanie z nginx -->
  <path d="M330,166 C305,215 205,212 175,236" fill="none" stroke="#4a5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="22" y="196" fill="#1d2433" font-size="12">/crm/…</text>
  <text x="22" y="212" fill="#5b6475" font-size="11">(aj /web/crm/blacklist → 302 sem)</text>

  <line x1="470" y1="166" x2="470" y2="236" stroke="#4a5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="478" y="206" fill="#1d2433" font-size="12">/web/…</text>

  <path d="M600,166 C640,200 760,205 790,236" fill="none" stroke="#4a5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="740" y="200" fill="#1d2433" font-size="12">/sso/…</text>

  <!-- Spring Boot (hotové) -->
  <rect x="30" y="238" width="290" height="132" rx="8" fill="#e6f4ea" stroke="#1e7d32" stroke-width="1.8"/>
  <text x="175" y="262" text-anchor="middle" font-weight="bold" fill="#1d2433">Nová appka – crm-web</text>
  <text x="175" y="280" text-anchor="middle" fill="#5b6475" font-size="12">Spring Boot 4.1.1 · Java 21 · JSP</text>
  <rect x="50" y="292" width="250" height="30" rx="5" fill="#ffffff" stroke="#1e7d32"/>
  <text x="175" y="312" text-anchor="middle" fill="#1e7d32" font-weight="bold">✔ Blacklist (zmigrované)</text>
  <text x="175" y="342" text-anchor="middle" fill="#1d2433" font-size="12">hlavička: operátor, zákazník,</text>
  <text x="175" y="358" text-anchor="middle" fill="#1d2433" font-size="12">posledný záznam, hlášky</text>

  <!-- Liferay (ešte nezmigrované) -->
  <rect x="330" y="238" width="290" height="132" rx="8" fill="#fdf1e3" stroke="#c46a0f" stroke-width="1.8"/>
  <text x="475" y="262" text-anchor="middle" font-weight="bold" fill="#1d2433">Stará appka – Liferay 6.2</text>
  <text x="475" y="280" text-anchor="middle" fill="#5b6475" font-size="12">Java 8 · Spring Portlet MVC · JSP</text>
  <rect x="350" y="292" width="250" height="30" rx="5" fill="#ffffff" stroke="#c46a0f"/>
  <text x="475" y="312" text-anchor="middle" fill="#c46a0f" font-weight="bold">⏳ Dashboard (ešte v Liferay)</text>
  <text x="475" y="342" text-anchor="middle" fill="#1d2433" font-size="12">portlet hlavičky v theme;</text>
  <text x="475" y="358" text-anchor="middle" fill="#1d2433" font-size="12">PortletSession + Redis (flag)</text>

  <!-- SSO mock -->
  <rect x="680" y="238" width="230" height="132" rx="8" fill="#f4f6f8" stroke="#4a5563" stroke-width="1.6"/>
  <text x="795" y="262" text-anchor="middle" font-weight="bold" fill="#1d2433">SSO portál (mock)</text>
  <text x="795" y="280" text-anchor="middle" fill="#5b6475" font-size="12">Spring Boot · REST</text>
  <text x="795" y="306" text-anchor="middle" fill="#1d2433" font-size="12">identita operátora</text>
  <text x="795" y="322" text-anchor="middle" fill="#1d2433" font-size="12">a vybraný zákazník</text>
  <text x="795" y="348" text-anchor="middle" fill="#5b6475" font-size="11">GET /sso/api/sessions/{SSO_ID}</text>

  <!-- Identita zo SSO (prerušované) -->
  <path d="M175,370 C175,405 640,405 700,372" fill="none" stroke="#4a5563" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <path d="M520,370 C540,395 640,395 712,372" fill="none" stroke="#4a5563" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="650" y="412" fill="#5b6475" font-size="11">identita (REST podľa SSO_ID)</text>

  <!-- Zdieľaná session -->
  <line x1="130" y1="370" x2="230" y2="452" stroke="#b8323b" stroke-width="2" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <text x="54" y="420" fill="#b8323b" font-size="12">zápis + čítanie</text>
  <text x="54" y="436" fill="#b8323b" font-size="12">(vždy Redis)</text>

  <line x1="430" y1="370" x2="400" y2="452" stroke="#b8323b" stroke-width="2" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <text x="424" y="424" fill="#b8323b" font-size="12">zápis do oboch, čítanie</text>
  <text x="424" y="440" fill="#b8323b" font-size="12">podľa flagu PORTLET / REDIS</text>

  <rect x="150" y="454" width="420" height="124" rx="8" fill="#fdecea" stroke="#b8323b" stroke-width="1.8"/>
  <text x="360" y="478" text-anchor="middle" font-weight="bold" fill="#1d2433">Redis – zdieľaná session</text>
  <text x="360" y="500" text-anchor="middle" fill="#1d2433" font-family="Consolas, monospace" font-size="12">crm:session:{SSO_ID}   (hash, TTL 30 min, JSON)</text>
  <text x="360" y="520" text-anchor="middle" fill="#1d2433" font-family="Consolas, monospace" font-size="12">APP_MESSAGES · APP_LAST_VIEWED_RECORD</text>
  <text x="360" y="538" text-anchor="middle" fill="#1d2433" font-family="Consolas, monospace" font-size="12">APP_BLACKLIST_LAST_CRITERIA</text>
  <text x="360" y="562" text-anchor="middle" fill="#5b6475" font-family="Consolas, monospace" font-size="12">crm:flags:session-read-source = PORTLET | REDIS</text>

  <!-- Legenda -->
  <rect x="640" y="460" width="270" height="118" rx="6" fill="#ffffff" stroke="#dde2ea"/>
  <text x="654" y="480" font-weight="bold" fill="#1d2433" font-size="12">Legenda</text>
  <rect x="654" y="490" width="14" height="12" fill="#e6f4ea" stroke="#1e7d32"/>
  <text x="676" y="500" fill="#1d2433" font-size="12">zmigrované do Spring Boot</text>
  <rect x="654" y="510" width="14" height="12" fill="#fdf1e3" stroke="#c46a0f"/>
  <text x="676" y="520" fill="#1d2433" font-size="12">ešte v Liferay</text>
  <line x1="654" y1="538" x2="668" y2="538" stroke="#b8323b" stroke-width="2"/>
  <text x="676" y="542" fill="#1d2433" font-size="12">zdieľaná session (Redis)</text>
  <line x1="654" y1="558" x2="668" y2="558" stroke="#4a5563" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="676" y="562" fill="#1d2433" font-size="12">identita zo SSO portálu</text>
</svg>
