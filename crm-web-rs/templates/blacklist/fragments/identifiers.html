<div id="identifiers">
{% if !error_key.is_empty() %}
    <div class="portlet-msg-error">{{ tags.msg(error_key) }}</div>
{% endif %}
<ul>
    {% for i in identifiers %}
    <li>
        {{ tags.msg_of("blacklist.identifier.", i.kind.name()) }}: {{ i.value }}
        {% if tags.can("BLACKLIST_MODIFY") %}
        <a id="remove-ident-{{ i.id }}" href="#" data-ajax-post="{{ tags.resource("removeIdentAction").param("detailId", detail_id).param("identId", i.id) }}" data-ajax-target="#identifiers">{{ tags.msg("blacklist.detail.removeIdentifier") }}</a>
        {% endif %}
    </li>
    {% endfor %}
</ul>
</div>
