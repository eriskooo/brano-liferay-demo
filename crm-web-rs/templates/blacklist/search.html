{% extends "layout/base.html" %}
{% block content %}
<h2>{{ tags.msg("blacklist.search.title") }}</h2>
<form id="searchForm" action="{{ tags.action("searchAction") }}" method="post">
    {{ errors.all_html("searchCriteria")|safe }}
    <div>
        <label for="firstName">{{ tags.msg("blacklist.search.firstName") }}</label>
        <input id="firstName" name="firstName" type="text" value="{{ form.v("firstName") }}"/>
    </div>
    <div>
        <label for="lastName">{{ tags.msg("blacklist.search.lastName") }}</label>
        <input id="lastName" name="lastName" type="text" value="{{ form.v("lastName") }}"/>
    </div>
    <div>
        <label for="identifierValue">{{ tags.msg("blacklist.search.identifier") }}</label>
        <input id="identifierValue" name="identifierValue" type="text" value="{{ form.v("identifierValue") }}"/>
    </div>
    <div>
        <label for="state">{{ tags.msg("blacklist.search.state") }}</label>
        <select id="state" name="state">
            <option value="">{{ tags.msg("blacklist.search.anyState") }}</option>
            {% for s in states %}
            <option value="{{ s.name() }}"{% if form.v("state") == s.name() %} selected="selected"{% endif %}>{{ tags.msg_of("blacklist.state.", s.name()) }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary">{{ tags.msg("blacklist.search.submit") }}</button>
</form>
<form id="clearForm" method="get" action="{{ tags.render("newSearch") }}" class="crm-inline">
    <button type="submit" class="btn">{{ tags.msg("blacklist.search.clear") }}</button>
</form>
{% if tags.can("BLACKLIST_MODIFY") %}
<form id="gotoCreateForm" method="get" action="{{ tags.render("create") }}" class="crm-inline">
    <button type="submit" class="btn">{{ tags.msg("blacklist.search.create") }}</button>
</form>
{% endif %}
{% endblock %}
