# Servíruje kb.html pre Neo4j Browser (:play). Browser beží na inom porte (iný origin), preto CORS.
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control no-cache always;
        charset utf-8;
    }
}
