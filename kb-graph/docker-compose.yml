# Znalostná báza v grafe (podprojekt 5): Neo4j len na localhoste. Samostatný compose projekt – bežný stack
# v docker/docker-compose.yml sa nemení. Databáza je jednorazová (bez volume): naplní ju `kb-graph/kb.sh load` z JSON.
name: kb-graph

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/kbdemo123
      # Klikací guide z kb-graph/guide/kb.html sa otvorí po prihlásení. Allowlist netreba – Browser 5.26
      # má localhost povolený predvolene (a setting browser.remote_content_hostname_allowlist už nepozná).
      NEO4J_browser_post__connect__cmd: play http://localhost:7475/kb.html
    ports:
      - "127.0.0.1:7474:7474"   # Neo4j Browser
      - "127.0.0.1:7687:7687"   # Bolt (loader, driver)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 > /dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Statický server pre guide (Browser ho načítava z prehliadača, nie z kontajnera Neo4j – preto localhost).
  guide:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:7475:80"
    volumes:
      - ./guide:/usr/share/nginx/html:ro
      - ./guide/nginx.conf:/etc/nginx/conf.d/default.conf:ro
