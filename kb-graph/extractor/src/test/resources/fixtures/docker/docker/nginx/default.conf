server {
    listen 80;

    location /sso/ {
        proxy_pass http://sso-mock:8090;
    }

    location /web/crm/blacklist {
        return 302 /crm/blacklist/search;
    }

    location /crm/ {
        proxy_pass http://crm-web:8080;
        proxy_set_header Host $http_host;
    }

    location /crm-rs/ {
        resolver 127.0.0.11 valid=10s;
        set $crm_rs http://crm-web-rs:8080;
        proxy_pass $crm_rs;
    }

    location = / {
        return 302 /web/crm/blacklist;
    }

    location / {
        proxy_pass http://liferay:8080;
    }
}
